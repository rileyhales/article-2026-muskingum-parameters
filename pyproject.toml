[project]
name = "muskingum-parameters"
version = "0.1.0"
description = "Muskingum routing implementation and parameterization for large domain hydrology models"
requires-python = ">=3.14"
dependencies = [
    "geopandas",
    "matplotlib",
    "netcdf4",
    "numpy",
    "pandas",
    "pyarrow",
    "pyogrio",
    "river-route",
    "scipy",
    "xarray",
]

[tool.uv]
package = false

[tool.uv.sources]
# the river-route that routed the matrix, commit 0ac029a with vendor/river-route-matrix/uncommitted.diff applied
river-route = { path = "vendor/river-route-matrix", editable = true }
